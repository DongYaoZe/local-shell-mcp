# DeepSeek Harness bundle: bridge an already-running local-shell-mcp service
# into DSH through the official MCP client. The full LSM tool surface is kept;
# DSH profiles may narrow it later with their own ctx.tools restrictions.
-
  insert:
    - id: mcp-local-shell
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: lsm
        transport: streamable-http
        url: !!js process.env.DSH_LSM_MCP_URL ?? 'http://127.0.0.1:8765/mcp'
        headers: !!js "process.env.DSH_LSM_AUTHORIZATION ? { Authorization: process.env.DSH_LSM_AUTHORIZATION } : {}"
        toolCallTimeoutMs: !!js Number(process.env.DSH_LSM_TOOL_CALL_TIMEOUT_MS ?? 120000)
        failOnStartupError: false
        reconnect:
          enabled: true
          initialDelayMs: 500
          maxDelayMs: 30000
          maxAttempts: 10
