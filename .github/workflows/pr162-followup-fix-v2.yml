name: PR 162 follow-up fix v2

on:
  push:
    branches:
      - feat/logical-session-runtime-v4

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/logical-session-runtime-v4
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply review fixes
        shell: bash
        run: |
          sed -n "/^[[:space:]]*python - <<'PY'$/,/^[[:space:]]*PY$/p" .github/workflows/pr162-followup-fix.yml \
            | sed '1d;$d;s/^          //' > /tmp/pr162-fix.py
          python /tmp/pr162-fix.py
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_live_workspace.py")
          text = path.read_text()

          old = 'started = manager.manage("direct", "user", action="start", objective="Cancelable task")'
          new = 'started = manager.manage("direct", "local-mcp-client", action="start", objective="Cancelable task")'
          if text.count(old) != 1:
              raise SystemExit(f"cancel fixture identity: expected one match, found {text.count(old)}")
          text = text.replace(old, new, 1)

          old = '''@pytest.mark.asyncio
async def test_completed_tool_result_survives_session_activity_write_failure(
    tmp_path, monkeypatch
):
    _configure(tmp_path, monkeypatch, auth="none")
    mcp = build_mcp()
    _, started = await mcp.call_tool(
        "session_manage", {"action": "start", "objective": "Persist activity"}
    )
    run_id = started["data"]["active_run"]["run_id"]
    manager = session_runtime_module.get_session_runtime_manager()

    def fail_save(_session):
        raise OSError("state volume full")

    monkeypatch.setattr(manager, "_save_locked", fail_save)
    _, result = await mcp.call_tool(
        "write_file",
        {
            "path": "completed.txt",
            "content": "completed once",
            "session_run_id": run_id,
        },
    )
    assert result["ok"] is True
    assert (tmp_path / "completed.txt").read_text(encoding="utf-8") == "completed once"
'''
          new = '''@pytest.mark.asyncio
async def test_tool_does_not_execute_when_start_lease_persistence_fails(
    tmp_path, monkeypatch
):
    _configure(tmp_path, monkeypatch, auth="none")
    mcp = build_mcp()
    _, started = await mcp.call_tool(
        "session_manage", {"action": "start", "objective": "Persist activity"}
    )
    run_id = started["data"]["active_run"]["run_id"]
    manager = session_runtime_module.get_session_runtime_manager()

    def fail_save(_session):
        raise OSError("state volume full")

    monkeypatch.setattr(manager, "_save_locked", fail_save)
    with pytest.raises(Exception, match="refusing to execute"):
        await mcp.call_tool(
            "write_file",
            {
                "path": "completed.txt",
                "content": "must not be written",
                "session_run_id": run_id,
            },
        )
    assert not (tmp_path / "completed.txt").exists()
'''
          if text.count(old) != 1:
              raise SystemExit(f"fail-closed integration test: expected one match, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,docs]'
      - name: Run focused regression tests
        run: PYTHONPATH=src python -m pytest -q tests/test_session_runtime.py tests/test_session_runtime_review_followup.py tests/test_live_workspace.py
      - name: Run Python suite
        run: PYTHONPATH=src python -m pytest -q
      - name: Run lint and diff checks
        run: |
          python -m ruff check src/local_shell_mcp/session_runtime.py tests/test_session_runtime.py tests/test_session_runtime_review_followup.py tests/test_live_workspace.py
          git diff --check
      - name: Commit fixes
        shell: bash
        run: |
          git config user.name 'Castronaut'
          git config user.email 'caoyuhang@fwerkor.com'
          git add src/local_shell_mcp/session_runtime.py tests/test_session_runtime.py tests/test_session_runtime_review_followup.py tests/test_live_workspace.py README.md docs/guides/human-interface.md
          git commit -m 'fix: harden session recovery and lease safety'
          git push origin HEAD:feat/logical-session-runtime-v4
