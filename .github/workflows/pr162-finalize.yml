name: PR 162 final verification

on:
  push:
    branches:
      - feat/logical-session-runtime-v4
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PYTHONUNBUFFERED: "1"

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          cd ui
          bun install --frozen-lockfile
      - name: Apply review fixes
        run: python .github/pr162_finalize.py
      - name: Focused regressions
        run: pytest -q tests/test_session_runtime.py tests/test_live_workspace.py
      - name: Full Python suite
        run: pytest -q
      - name: Lint
        run: ruff check .
      - name: Test and build UI
        working-directory: ui
        run: |
          bun run test
          bun run typecheck
          bun run build
      - name: Validate and commit fixes
        run: |
          git diff --check
          git status --short
          git add src/local_shell_mcp/session_runtime.py tests/test_session_runtime.py ui/src/live-workspace.ts src/local_shell_mcp/ui_static
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No patch changes to commit"
            exit 0
          fi
          git config user.name "Cao Yuhang"
          git config user.email "caoyuhang@fwerkor.com"
          git commit -m "fix: complete logical session lifecycle recovery"
          git push origin HEAD:feat/logical-session-runtime-v4
