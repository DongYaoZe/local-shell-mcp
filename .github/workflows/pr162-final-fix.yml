name: PR 162 final review fixes

on:
  push:
    branches: [feat/logical-session-runtime-v4]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/logical-session-runtime-v4
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          path = Path("src/local_shell_mcp/session_runtime.py")
          text = path.read_text()
          text = replace_once(
              text,
              '''            previous_session = self._sessions.get(previous[0])
            if previous_session is not None:
                previous_run = next(
''',
              '''            previous_session = self._sessions.get(previous[0])
            if previous_session is not None and previous_session.subject != session.subject:
                self._attachments.pop(session_key, None)
                previous_session = None
            if previous_session is not None:
                previous_run = next(
''',
              "cross-principal attachment",
          )
          text = replace_once(
              text,
              '''            try:
                self._assert_attachment_locked(session_key, subject=subject)
            except (RuntimeError, PermissionError):
                return None
            return attachment[0]
''',
              '''            try:
                self._assert_attachment_locked(session_key, subject=subject)
            except (RuntimeError, PermissionError, ValueError):
                self._attachments.pop(session_key, None)
                return None
            return attachment[0]
''',
              "stale deleted attachment",
          )
          path.write_text(text)

          path = Path("src/local_shell_mcp/tools.py")
          text = path.read_text()
          text = replace_once(
              text,
              '''        session_key = mcp_session_key(mcp)
        logical_session_id = get_session_runtime_manager().current_session_id(
            session_key, subject=subject
        )
        if logical_session_id is None and session_id:
            get_session_runtime_manager().get(session_id, subject=subject)
            logical_session_id = session_id
''',
              '''        session_key = mcp_session_key(mcp)
        session_manager = get_session_runtime_manager()
        logical_session_id = await asyncio.to_thread(
            session_manager.current_session_id,
            session_key,
            subject=subject,
        )
        if logical_session_id is None and session_id:
            await asyncio.to_thread(session_manager.get, session_id, subject=subject)
            logical_session_id = session_id
''',
              "live session lookup offload",
          )
          path.write_text(text)

          path = Path("tests/test_session_runtime_review_followup.py")
          text = path.read_text()
          text += '''


def test_cross_principal_transport_reuse_does_not_detach_previous_run(tmp_path):
    manager = SessionRuntimeManager(tmp_path / ".state")
    first = manager.manage("shared", "alice", action="start", objective="Alice task")
    first_id = first["session_id"]
    first_run_id = first["active_run"]["run_id"]

    second = manager.manage("shared", "bob", action="start", objective="Bob task")

    alice = manager.get(first_id, subject="alice")
    assert alice["active_run"]["run_id"] == first_run_id
    assert alice["active_run"]["status"] == "active"
    assert manager.current_session_id("shared", subject="bob") == second["session_id"]


def test_current_session_id_drops_attachment_for_missing_session(tmp_path):
    manager = SessionRuntimeManager(tmp_path / ".state")
    started = manager.manage("mcp:a", "user", action="start", objective="Task")
    session_id = started["session_id"]
    manager._sessions.pop(session_id)

    assert manager.current_session_id("mcp:a", subject="user") is None
    assert "mcp:a" not in manager._attachments
'''
          path.write_text(text)

          path = Path("tests/test_live_workspace.py")
          text = path.read_text()
          text += '''


@pytest.mark.asyncio
async def test_live_workspace_session_lookups_run_off_event_loop(tmp_path, monkeypatch):
    _configure(tmp_path, monkeypatch, auth="none")
    manager = session_runtime_module.get_session_runtime_manager()
    target = manager.manage(
        "other-transport",
        "local-mcp-client",
        action="start",
        objective="Reconnect target",
    )
    loop_thread = threading.get_ident()
    current_threads: list[int] = []
    get_threads: list[int] = []
    original_current = manager.current_session_id
    original_get = manager.get

    def observed_current(*args, **kwargs):  # noqa: ANN002, ANN003, ANN202
        current_threads.append(threading.get_ident())
        return original_current(*args, **kwargs)

    def observed_get(*args, **kwargs):  # noqa: ANN002, ANN003, ANN202
        get_threads.append(threading.get_ident())
        return original_get(*args, **kwargs)

    monkeypatch.setattr(manager, "current_session_id", observed_current)
    monkeypatch.setattr(manager, "get", observed_get)
    mcp = build_mcp()
    await mcp.call_tool(
        "live_workspace_reconnect",
        {"cwd": ".", "session_id": target["session_id"]},
    )

    assert current_threads and all(thread_id != loop_thread for thread_id in current_threads)
    assert get_threads and all(thread_id != loop_thread for thread_id in get_threads)
'''
          path.write_text(text)
          PY
      - name: Install dependencies
        run: python -m pip install -e '.[dev,docs]'
      - name: Focused tests
        run: PYTHONPATH=src python -m pytest -q tests/test_session_runtime_review_followup.py tests/test_live_workspace.py
      - name: Full Python suite
        run: PYTHONPATH=src python -m pytest -q
      - name: Lint
        run: |
          python -m ruff check src/local_shell_mcp/session_runtime.py src/local_shell_mcp/tools.py tests/test_session_runtime_review_followup.py tests/test_live_workspace.py
          git diff --check
      - name: Commit and push
        run: |
          git config user.name Castronaut
          git config user.email caoyuhang@fwerkor.com
          git add src/local_shell_mcp/session_runtime.py src/local_shell_mcp/tools.py tests/test_session_runtime_review_followup.py tests/test_live_workspace.py
          git commit -m 'fix: close remaining session ownership races'
          git push origin HEAD:feat/logical-session-runtime-v4
